<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquagarden</title>
  </head>
  <body class="text-slate-100 w-screen h-screen relative">
    <!-- 3D 캔버스 -->
    <canvas id="webgl-canvas" class="w-full h-full absolute inset-0 block"></canvas>

    <!-- 사용량 HUD (곁눈질) — 좌상단 모서리 고정, 어항 중앙은 비운다.
         단색 반투명(.glassmorphism)·tabular-nums·pointer-events-none. -->
    <div id="hud-overlay" class="absolute top-4 left-4 z-20 pointer-events-none">
      <div class="glassmorphism rounded-2xl px-4 py-3 w-44">
        <div class="flex items-center justify-between">
          <span class="text-[10px] tracking-widest uppercase text-slate-400">Context</span>
          <span id="hud-context-pct" class="text-sm font-semibold text-white tabular-nums">—</span>
        </div>
        <div class="mt-1.5 h-1 w-full rounded-full bg-slate-700/60 overflow-hidden">
          <div
            id="hud-context-bar"
            class="h-full rounded-full bg-emerald-500 transition-all duration-300"
            style="width: 0%"
          ></div>
        </div>
        <div class="mt-2.5 flex items-center justify-between">
          <span class="text-[10px] tracking-widest uppercase text-slate-400">Tokens</span>
          <span id="hud-tokens" class="text-sm font-semibold text-white tabular-nums">—</span>
        </div>
      </div>
    </div>

    <!-- 로딩 화면 -->
    <div
      id="loading"
      class="absolute inset-0 z-50 flex flex-col justify-center items-center bg-slate-950 transition-opacity duration-1000"
    >
      <div class="w-16 h-16 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-6"></div>
      <h1 class="text-2xl font-bold tracking-wider mb-2 text-emerald-400">수족관 조성 중...</h1>
      <p class="text-slate-400 text-sm animate-pulse">자연 경관, 수초, 물고기 생태계를 생성하고 있습니다.</p>
    </div>

    <!-- UI 오버레이 — 위젯 크기(작은 창)에 맞춘 컴팩트 레이아웃.
         어항이 주인공이므로 풀스크린 chrome(타이틀·가이드·생물사전)은 두지 않고,
         작은 조명 토글 + 명언 카드만. HUD는 별도 #hud-overlay. -->
    <div id="ui-overlay" class="absolute inset-0 pointer-events-none z-10">
      <!-- 조명 토글 (우상단, 컴팩트) -->
      <div class="absolute top-3 right-3 glassmorphism rounded-xl p-1 flex gap-0.5 pointer-events-auto">
        <button id="btn-day" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold transition-colors bg-emerald-500 text-slate-950">낮</button>
        <button id="btn-dusk" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold text-slate-300 hover:bg-slate-700/50 transition-colors">노을</button>
        <button id="btn-night" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold text-slate-300 hover:bg-slate-700/50 transition-colors">밤</button>
      </div>

      <!-- 명언 카드 (중앙, 위젯 크기에 맞춤) -->
      <div
        id="quote-card"
        class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[86%] glassmorphism rounded-2xl p-4 shadow-2xl transition-all duration-500 scale-95 opacity-0 pointer-events-none border border-emerald-500/30 flex flex-col items-center text-center"
      >
        <button id="quote-close" class="absolute top-2 right-3 text-slate-400 hover:text-white pointer-events-auto transition-colors">✕</button>
        <span id="quote-tag" class="text-[9px] font-bold tracking-widest text-emerald-400 uppercase bg-emerald-500/10 px-2 py-0.5 rounded-full mb-2">유목</span>
        <p id="quote-text" class="quote-font text-xs leading-relaxed text-slate-100 font-medium my-1">
          "많은 사람들이 평생을 낚시를 하면서도, 그들이 추구하는 것이 물고기가 아니라는 것을 깨닫지 못한다."
        </p>
        <p id="quote-author" class="text-[10px] text-slate-400 font-light mt-1">- 헨리 데이비드 소로우</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

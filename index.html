<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquagarden</title>
  </head>
  <body class="text-slate-100 w-screen h-screen relative">
    <!-- 3D 캔버스 -->
    <canvas id="webgl-canvas" class="w-full h-full absolute inset-0 block"></canvas>

    <!-- 사용량 HUD (곁눈질) — 좌상단 고정. 평소엔 흐릿(.hud-faint)하다가 호버 시 또렷(.hud-bright).
         단색 반투명·tabular-nums·pointer-events-none. 감상 방해 최소화. -->
    <div id="hud-overlay" class="hud-faint absolute top-4 left-4 z-20 pointer-events-none">
      <div class="glassmorphism rounded-2xl px-4 py-3 w-44">
        <div class="flex items-center justify-between">
          <span class="text-[10px] tracking-widest uppercase text-slate-400">Context</span>
          <span id="hud-context-pct" class="text-sm font-semibold text-white tabular-nums">—</span>
        </div>
        <div class="mt-1.5 h-1 w-full rounded-full bg-slate-700/60 overflow-hidden">
          <div
            id="hud-context-bar"
            class="h-full rounded-full bg-emerald-500 transition-all duration-300"
            style="width: 0%"
          ></div>
        </div>
        <div class="mt-2.5 flex items-center justify-between">
          <span class="text-[10px] tracking-widest uppercase text-slate-400">Tokens</span>
          <span id="hud-tokens" class="text-sm font-semibold text-white tabular-nums">—</span>
        </div>
      </div>
    </div>

    <!-- 로딩 화면 -->
    <div
      id="loading"
      class="absolute inset-0 z-50 flex flex-col justify-center items-center bg-slate-950 transition-opacity duration-1000"
    >
      <div class="w-16 h-16 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-6"></div>
      <h1 class="text-2xl font-bold tracking-wider mb-2 text-emerald-400">수족관 조성 중...</h1>
      <p class="text-slate-400 text-sm animate-pulse">자연 경관, 수초, 물고기 생태계를 생성하고 있습니다.</p>
    </div>

    <!-- UI 오버레이 — 어항이 주인공. chrome은 호버로만 드러난다. HUD는 별도 #hud-overlay. -->
    <div id="ui-overlay" class="absolute inset-0 pointer-events-none z-10">
      <!-- 리사이즈 그립 — 프레임리스 창의 가장자리/모서리 드래그 리사이즈. 투명·얇음. -->
      <div class="resize-grip resize-n" data-resize="north"></div>
      <div class="resize-grip resize-s" data-resize="south"></div>
      <div class="resize-grip resize-e" data-resize="east"></div>
      <div class="resize-grip resize-w" data-resize="west"></div>
      <div class="resize-grip resize-ne" data-resize="north_east"></div>
      <div class="resize-grip resize-nw" data-resize="north_west"></div>
      <div class="resize-grip resize-se" data-resize="south_east"></div>
      <div class="resize-grip resize-sw" data-resize="south_west"></div>

      <!-- 컨트롤 클러스터 (우상단) — 평소엔 숨고, 어항에 마우스를 올리면 드러난다.
           조명 토글 + 메뉴(⋯) 버튼. 우클릭으로도 메뉴를 연다. -->
      <div id="controls" class="chrome chrome-hidden absolute top-3 right-3 flex items-center gap-1.5 pointer-events-auto">
        <div class="glassmorphism rounded-xl p-1 flex gap-0.5">
          <button id="btn-day" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold transition-colors bg-emerald-500 text-slate-950">낮</button>
          <button id="btn-dusk" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold text-slate-300 hover:bg-slate-700/50 transition-colors">노을</button>
          <button id="btn-night" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold text-slate-300 hover:bg-slate-700/50 transition-colors">밤</button>
        </div>
        <button
          id="menu-button"
          aria-label="메뉴"
          aria-haspopup="true"
          class="glassmorphism rounded-xl w-7 h-7 flex items-center justify-center text-slate-300 hover:text-white transition-colors"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <circle cx="3" cy="8" r="1.4" />
            <circle cx="8" cy="8" r="1.4" />
            <circle cx="13" cy="8" r="1.4" />
          </svg>
        </button>
      </div>

      <!-- 메뉴 팝오버 — 메뉴 버튼 클릭 또는 어항 우클릭 시 표시. 투명도·투과모드·숨기기·종료. -->
      <div
        id="menu-popover"
        role="menu"
        class="hidden absolute z-30 w-52 glassmorphism rounded-xl p-2 shadow-2xl pointer-events-auto flex-col gap-0.5"
      >
        <div class="px-2 pt-1 pb-2">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[10px] tracking-widest uppercase text-slate-400">투명도</span>
            <span id="opacity-value" class="text-[11px] font-semibold text-white tabular-nums">100%</span>
          </div>
          <input
            id="opacity-slider"
            type="range"
            min="25"
            max="100"
            value="100"
            step="5"
            class="w-full accent-emerald-500 cursor-pointer"
            aria-label="투명도"
          />
        </div>
        <button id="menu-passthrough" role="menuitemcheckbox" aria-checked="false" class="flex items-center justify-between w-full px-2 py-1.5 rounded-lg text-[12px] text-slate-200 hover:bg-slate-700/50 transition-colors">
          <span>투과 모드</span>
          <span id="passthrough-state" class="text-[10px] font-semibold text-slate-500 border border-white/15 rounded-full px-1.5 py-0.5">꺼짐</span>
        </button>
        <div class="h-px bg-white/10 mx-1 my-0.5"></div>
        <button id="menu-hide" role="menuitem" class="flex items-center justify-between w-full px-2 py-1.5 rounded-lg text-[12px] text-slate-200 hover:bg-slate-700/50 transition-colors">
          <span>잠깐 숨기기</span><span class="text-[10px] text-slate-500">⌘⌥A</span>
        </button>
        <button id="menu-quit" role="menuitem" class="flex items-center justify-between w-full px-2 py-1.5 rounded-lg text-[12px] text-slate-200 hover:bg-slate-700/50 transition-colors">
          <span>종료</span><span class="text-[10px] text-slate-500">⌘⌥Q</span>
        </button>
      </div>

      <!-- 물고기 대사 — 클릭한 물고기 머리 위를 따라다니는 작고 사색적인 한마디(JS가 left/top 설정).
           bottom-center 기준점이 물고기 위에 오도록 translate. 잠시 보였다 사라진다. -->
      <div id="fish-line" class="chrome chrome-hidden absolute top-0 left-0 -translate-x-1/2 -translate-y-full max-w-[168px] pointer-events-none text-center">
        <p id="fish-line-text" class="fish-line-text quote-font text-[10px] leading-snug"></p>
      </div>

      <!-- 접힘(잠깐 숨기기) 상태의 ⋯ 퍽 — body.collapsed 일 때만 표시. 클릭하면 어항 복귀. -->
      <button id="puck" aria-label="어항 다시 보기" class="pointer-events-auto absolute inset-0 m-auto w-12 h-12 rounded-2xl glassmorphism flex items-center justify-center text-slate-200 hover:text-white transition-colors">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <circle cx="3" cy="8" r="1.5" />
          <circle cx="8" cy="8" r="1.5" />
          <circle cx="13" cy="8" r="1.5" />
        </svg>
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
